[package]
name = "pdmvos-core"
version = "4.0.0"
edition = "2021"
license = "MIT"
description = "Native Rust physics, geometry, pixel processing, and policy core for pdmvOS"

[lib]
name = "pdmvos_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
shairplay = { version = "=0.13.0", default-features = false, features = ["video"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
